name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Interdire les commentaires qui coupent les contrôles
        run: |
          if grep -rnE "eslint-disable|@ts-(nocheck|ignore|expect-error)|(v8|c8|istanbul) ignore|\.(skip|only|todo)\(" src e2e; then
            echo "Commentaire ou appel qui coupe un contrôle : interdit."
            exit 1
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Recherche de secrets (gitleaks 8.30.1, somme vérifiée)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --no-banner --redact -v --config .github/gitleaks.toml --gitleaks-ignore-path .github/ .
